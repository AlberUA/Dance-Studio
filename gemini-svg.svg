<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Неоновий градієнт K-Pop -->
    <linearGradient id="kpop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Ефект світіння -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Темна округлена база -->
  <rect width="64" height="64" rx="16" fill="#0b0813"/>

  <!-- Зірка-спалах (K-Pop Sparkle) -->
  <path d="M32 6 C32 21 21 32 6 32 C21 32 32 43 32 58 C32 43 43 32 58 32 C43 32 32 21 32 6 Z" fill="url(#kpop-grad)" filter="url(#glow)"/>

  <!-- Міні-корона / Акцент у центрі -->
  <path d="M25 36 L22 28 L28 31 L32 25 L36 31 L42 28 L39 36 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
